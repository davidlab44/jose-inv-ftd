

<ion-header>
  <ion-toolbar>
    <ion-title>Producto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Imagen -->
  <div class="image-container" (click)="openZoom()">
    <img
      [src]="items?.data?.img"
      alt="Imagen del producto"
      class="product-image"
    />
  </div>

  <!-- Datos -->
  <div class="info">
    <h2 class="name">{{ items?.data?.name }}</h2>
    <p class="qty">Cantidad: <i>{{ items?.data?.qty }}</i></p>
  </div>

  <div class="info">
    <p class="qty">{{ items?.data?.bop }}</p>
  </div>

</ion-content>

<div class="zoom-overlay" *ngIf="zoomActive" (click)="closeZoom()">
  <img
    [src]="items?.data?.img"
    alt="Zoom imagen"
    class="zoom-image"
  />
</div>
