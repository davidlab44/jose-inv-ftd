<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar color="light" class="subheader-toolbar">
    <ion-grid>
      <ion-row>
        <ion-col size="8">
          <ion-row>
            <ion-col>
              <ion-title class="subheader-title">
                Movimientos | Salida de mercancia
              </ion-title>
            </ion-col>
          </ion-row>
          <ion-row>
              <ion-col>
                <ion-title class="subheader-title" style="font-size: xx-small;"  >
                  <i> {{todayDate}} </i>                      
                </ion-title>
              </ion-col>
          </ion-row>
        </ion-col>
        <ion-col size="4" class="ion-text-right">
          <ion-row>
            <ion-col>
              <ng-container *ngIf="exitList?.length > 0; else noItems">
                <strong>{{ exitList.length }} items</strong>
              </ng-container>
              <ng-template #noItems style="font-size: small;" >
                <span style="font-size: xx-small;" ><strong>No hay items</strong></span>
              </ng-template>
            </ion-col>
          </ion-row>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card class="main-card" [class.disabled]="prdct && !componentsEnabled">
    <ion-card-content>
      <div class="scan-container">
        <video #video autoplay playsinline class="video-preview"></video>
        <div class="scan-row">
          <ion-button color="danger" class="scan-btn" (click)="stopScan()">
            <ion-icon name="stop-circle-outline"></ion-icon>
          </ion-button>
          <ion-item class="scan-input">
            <ion-input #scanInput [(ngModel)]="scannedValue" (ionInput)="onInputChange()" type="text"></ion-input>
          </ion-item>
          <ion-button class="scan-btn" (click)="startScan()">
            <ion-icon name="camera-outline"></ion-icon>
          </ion-button>
        </div>
      </div>
      <ng-container *ngIf="prdct">
        <div class="product-section">
            <ion-grid class="product-row">
              <ion-row class="ion-align-items-center">
                <ion-col size="2" class="col-categ" style="font-size:xx-small ;"  > 
                  {{ getCategoryNameById(prdct.data.categ[0]) | uppercase }}
                </ion-col>
                <ion-col size="8" class="col-name">
                  {{ prdct.data.name | uppercase }}
                </ion-col>
                <ion-col size="2" class="col-qty">
                  <strong style="font-size:xx-small;"   >{{ prdct?.data?.qty }}</strong>
                  <span style="font-size: xx-small;"> {{ getUmNameById(prdct?.data?.um) }}</span>
                </ion-col>
              </ion-row>
            </ion-grid>
        </div>
        <div class="quantity-container">
          <ion-item class="quantity-item">
            <ion-input
              type="number"
              [(ngModel)]="extraQty"
              [readonly]="!componentsEnabled"
              inputmode="numeric"
              class="quantity-input">
            </ion-input>
          </ion-item>
          <div class="quantity-buttons">
            <ion-button color="medium" expand="block" (click)="clearQty()" [disabled]="!componentsEnabled">Clear</ion-button>
            <ion-button color="primary" expand="block" (click)="addQty(1)" [disabled]="!componentsEnabled">1</ion-button>
            <ion-button color="success" expand="block" (click)="addQty(10)" [disabled]="!componentsEnabled">10</ion-button>
          </div>
          <div class="action-buttons-row ion-padding">
            <ion-button color="medium" shape="round" (click)="exitApp()">
              <ion-icon slot="icon-only" name="exit-outline"></ion-icon>
            </ion-button>
            <ion-button color="primary" shape="round" (click)="confirmAction()">
              <ion-icon slot="icon-only" name="checkmark-circle-outline"></ion-icon>
            </ion-button>
          </div>
        </div>
      </ng-container>
   </ion-card-content>
  </ion-card>
  <ng-container *ngIf="!prdct">
    <div class="loading-container">
    <!--      <ion-spinner name="crescent"></ion-spinner>-->
      <!--<p>Cargando producto...</p>-->
    </div>
  </ng-container>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="openReport()">
      <ion-icon name="document-text-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
