<ion-header translucent="true">
  <ion-toolbar>
    <!-- Botón personalizado (NO ion-menu-button) -->
    <ion-buttons slot="start">
      <ion-button fill="clear" >
        <ion-icon slot="icon-only" name="menu"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button >
        <span >
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

   
  <ion-grid>
    <ion-row *ngFor="let task of mappedList" class="ion-align-items-center">
      <ion-col size="2">
        <span>{{task?.data?.mnt?.data?.cco?.data?.name}}</span>
      </ion-col>
      <ion-col size="9">
        <span>{{task?.data?.ats?.data?.name}}</span>
      </ion-col>
      <ion-col size="1">
        <ion-button fill="clear" size="small" (click)="requestSpv(task)">
          <ion-icon name="checkbox-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
