<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
   <ion-grid> 
     <ion-row>
       <ion-col size="12">
         <div>
           <div>
             <ion-grid class="bom-grid">
               <ion-row>
                <ion-col>
                  <h4>{{ user?.data?.name }} </h4>
                </ion-col>
              </ion-row> 
             </ion-grid>
           </div> 
         </div>
         <div>
           <span>&nbsp;&nbsp;</span><br>
           <span>&nbsp;&nbsp;<br></span>
         </div>
       </ion-col>
     </ion-row>
     <ion-row>
       <ion-col size="12"  *ngFor="let u of userList" >
         <ion-item button detail="false" (click)="selectUser(u)">
            <ion-label>
              {{ u?.data?.name }} 
            </ion-label>
         </ion-item>
       </ion-col>
     </ion-row>
   </ion-grid>
</ion-content>
