<ion-header translucent="true"> 
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"     
      [value]="hash"           
      (ionInput)="onSearch($event.detail.value)">
    </ion-searchbar>           
    <ion-buttons slot="end">   
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span> 
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>            
    </ion-buttons>
  </ion-toolbar>

<ion-content>
  <ion-list>
    <ion-grid
      *ngFor="let p of tasksList"
      class="subtask">
      <ion-row>
        <ion-col size="1" class="subtask-title">
          {{ p?.i }}
        </ion-col>
        <ion-col size="5" class="subtask-title">
          {{ p?.created_at }} 
        </ion-col>
        <ion-col size="3" class="subtask-title">
          {{ p?.data?.id_ats }}  
        </ion-col>
       <ion-col size="3" class="subtask-title">
          {{ p?.data?.id_cco }}  
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-list>
</ion-content>
