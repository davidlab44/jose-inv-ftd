<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button>
        <span>
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

    <br><br>
    <div class="image-picker">
      <ion-grid>
        <ion-row>
          <ion-col size="4" size-sm="3" size-md="2" *ngFor="let image of images; let i = index">
            <div class="photo-tile">
              <img [src]="image" [alt]="'Fotografía ' + (i + 1)" />
              <ion-button class="remove" fill="solid" color="danger" size="small"
                          [disabled]="uploading" (click)="removeImage(i)" aria-label="Eliminar fotografía">
                <ion-icon slot="icon-only" name="close-outline"></ion-icon>
              </ion-button>
            </div>
          </ion-col>
          <ion-col size="4" size-sm="3" size-md="2" *ngIf="images.length < maxImages">
            <button type="button" class="add-tile" [disabled]="uploading" (click)="addImage()" aria-label="Agregar fotografía">
              <ion-icon name="add-outline"></ion-icon>
              <span>Agregar foto</span>
            </button>
          </ion-col>
        </ion-row>
      </ion-grid>
      <ion-progress-bar *ngIf="uploading" [value]="uploadProgress / 100"></ion-progress-bar>
      <ion-note *ngIf="uploading">Subiendo: {{ uploadProgress }} %</ion-note>
      <ion-note color="danger" *ngIf="errorMessage">{{ errorMessage }}</ion-note>
      <ion-note color="medium">{{ images.length }} / {{ maxImages }} fotografías</ion-note>
    </div>

  </ion-list>
