<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title><span style="font-size:small;" >{{now}}</span></ion-title>
  </ion-toolbar>
</ion-header>


<ion-content>
  <ion-grid>
    <ion-row *ngFor="let task of mappedList" class="ion-align-items-center">

      <ion-col size="2">
        <span>{{task?.data?.mnt?.data?.cco?.data?.name}}</span>
      </ion-col>

      <ion-col size="9">
        <span>{{task?.data?.ats?.data?.name}}</span>
      </ion-col>

      <ion-col size="1">
        <ion-button fill="clear" size="small" (click)="requestSpv(task)">
          <ion-icon name="checkbox-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-col>

    </ion-row>
  </ion-grid>
</ion-content>
