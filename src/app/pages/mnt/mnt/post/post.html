<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      [value]="hash"
      (ionInput)="onSearch($event.detail.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-list *ngIf="filteredProductList.length > 0">
    <ion-item
      button
      detail="false"
      *ngFor="let p of filteredProductList"
      (click)="selectProduct(p)">
      <ion-label>
        {{ p.data.name }}
      </ion-label>
    </ion-item>
  </ion-list>
</ion-header>

<ion-content  class="ion-padding fondo-fade">
  <ion-grid class="bom-grid">
    <ion-row>
      <ion-col size="2"></ion-col>
      <ion-col size="8">
        <div class="iso-container" *ngIf="this.isotanq1?.id_cco>0">
          <div class="iso-tank" [style.background-color]="isoColor">
            <div class="iso-cap iso-cap-left" [style.background-color]="isoColor"></div>
            <div class="iso-name">{{ iso1?.data?.name }}</div>
            <div class="iso-cap iso-cap-right" [style.background-color]="isoColor"></div>
          </div>
        </div>
     </ion-col> 
    </ion-row>
    <ion-row>
      <ion-col size="2"></ion-col>
      <ion-col size="8"> 
       <div class="iso-container" *ngIf="this.isotanq2?.id_cco" >
         <div class="iso-tank" [style.background-color]="isoColor">
           <div class="iso-cap iso-cap-left" [style.background-color]="isoColor"></div>
           <div class="iso-name">{{ iso2?.data?.name }}</div>
           <div class="iso-cap iso-cap-right" [style.background-color]="isoColor"></div>
         </div>
       </div>
     </ion-col> 
    </ion-row>
  </ion-grid>

  <ion-button expand="block" (click)="post()" *ngIf="this.isotanq1?.id_cco>0">
    Guardar
  </ion-button>
  <br>
</ion-content>
