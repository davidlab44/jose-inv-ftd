<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content>
  <ion-list>
    <ion-item *ngFor="let p of productList" style="display:flex; align-items:center;">
      <ion-label style="font-size: small; flex: 1;">
        <span>{{ getCategoryNameById(p?.data?.categ?.[0]) | capitalize }}&nbsp;</span>
      </ion-label>
      <ion-label style="font-size: small; flex: 3;">
        <h3>{{ p?.data?.name | uppercase }}</h3>
      </ion-label>
      <ion-label style="font-size: small; flex: 0.5; text-align:right;">
        <strong>{{ p?.data?.qty }}</strong>
        <span style="font-size: xx-small;"> {{ getUmNameById(p?.data?.um) }}</span>
      </ion-label>
      <ion-button color="primary" slot="end" (click)="patch(p)">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
     <ion-button color="primary" slot="end" (click)="delete(p); $event.stopPropagation()">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
