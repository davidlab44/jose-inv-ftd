<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Category</ion-label>
        <ion-input type="number" formControlName="category"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Name</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Barcode</ion-label>
        <ion-input type="number" formControlName="barcode"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Qty</ion-label>
        <ion-input type="number" formControlName="qty"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">UM</ion-label>
        <ion-input type="number" formControlName="um"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Target</ion-label>
        <ion-input type="number" formControlName="target"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Reorder</ion-label>
        <ion-input type="number" formControlName="reorder"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Minimum</ion-label>
        <ion-input type="number" formControlName="minimum"></ion-input>
      </ion-item>








      <ion-item lines="none" >
          <table style="width:100%;">
            <tr>
              <td style="width:50%;">
                <span (click)="takePicture()">
                  <ion-icon style="font-size:30px;color: var(--ion-color-primary2,#585858);" slot="icon-only" name="camera-outline"> camera
                  </ion-icon>
                </span>
              </td>
              <td style="width:50%;">
                <span (click)="pickImage()">
                  <ion-icon style="font-size:30px;color: var(--ion-color-primary2,#585858);" slot="icon-only" name="attach-outline">
                  </ion-icon>
                </span>
              </td>
            </tr>
          </table>
        </ion-item>
        <ion-item>
          <table style="width:100%;">
            <tr>
              <td style="width:100%;">
                <div *ngIf="optimizedImage">
                  <img [src]="optimizedImage" alt="Servicio Image" width="150"/>
                </div>
              </td>
            </tr>
          </table>
        </ion-item>






    </ion-list>
    <br>
    <pre>{{lastAsset | json}}</pre>
    <br>
    <ion-button expand="block" (click)="guardar()">
      Guardar
    </ion-button>
  </form>

  <br>
  <br>
  <br>
  <br>
  <br>
  <pre>{{ categories | json }}</pre>
  <pre>{{ ums | json }}</pre>

</ion-content>
