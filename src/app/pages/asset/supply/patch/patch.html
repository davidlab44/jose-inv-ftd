<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">
  <form [formGroup]="form">    
    
    <!-- Campo oculto -->
    <input type="hidden" formControlName="id">

    <ion-list>

      <ion-button expand="block" (click)="takePhotoAndUpload()">
        📸 Tomar foto
      </ion-button>

      <ion-button expand="block" color="secondary" (click)="pickImageAndUpload()">
        🖼 Elegir de galería
      </ion-button>

      <ion-progress-bar
        *ngIf="uploading"
        [value]="uploadProgress / 100">
      </ion-progress-bar>

      <p *ngIf="uploading">
        Subiendo: {{ uploadProgress }} %
      </p>

      <ion-card *ngIf="uploadedUrl">
        <ion-card-header>
          <ion-card-title>Imagen subida</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <img [src]="uploadedUrl" />
          <p>{{ uploadedUrl }}</p>
        </ion-card-content>
      </ion-card>
      
      <p>ImageUrl: {{assetSupplyProduct.data.img}}</p>

      <ion-item>
        <ion-label position="floating">Category</ion-label>
        <ion-input type="number" formControlName="categ"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Name</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Bop</ion-label>
        <ion-input formControlName="bop"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Barcode</ion-label>
        <ion-input type="number" formControlName="barcode"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Qty</ion-label>
        <ion-input type="number" formControlName="qty"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">UM</ion-label>
        <ion-input type="number" formControlName="um"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Target/Optimal</ion-label>
        <ion-input type="number" formControlName="target"></ion-input>
      </ion-item>

     <ion-item>
        <ion-label position="floating">Reordenar</ion-label>
        <ion-input type="number" formControlName="reorder"></ion-input>
      </ion-item>

     <ion-item>
        <ion-label position="floating">Minimo</ion-label>
        <ion-input type="number" formControlName="minimum"></ion-input>
      </ion-item>


    </ion-list>

    <br>

    <ion-button expand="block" (click)="patch()">
      Guardar
    </ion-button>
  </form>
  <br>
  <br>
  <br>
  <br>
  <br>
  <pre>{{ categories | json }}</pre>
  <pre>{{ ums | json }}</pre>
</ion-content>
