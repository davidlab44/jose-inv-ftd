<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      #searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <div class="filter-row">
      <ion-item lines="none" class="filter-item">
        <ion-button slot="start" fill="clear" class="reload-btn" (click)="reloadPage()">
          <ion-icon name="refresh-outline"></ion-icon>
        </ion-button>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <ion-label class="filter-label">
          Categoría
        </ion-label>

        <ion-select
          class="filter-select"
          interface="popover"
          [(ngModel)]="selectedCategoryId"
          (ionChange)="filterProductsByCategory($event.detail.value)"
          placeholder="Todas"
        >
          <ion-select-option [value]="null">
            Todas
          </ion-select-option>

          <ion-select-option
            *ngFor="let c of categories"
            [value]="c.id"
          >
            {{ c.data?.nombre }}
          </ion-select-option>
        </ion-select>
        &nbsp;&nbsp;
        <ion-button slot="end" (click)="generatePurchaseOrderPDF()">
          <ion-icon name="print-outline"></ion-icon>
        </ion-button>
      </ion-item>
    </div>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [(ngModel)]="point" (ionChange)="updateSchedule()">
      <ion-segment-button value="reorder"> Normal </ion-segment-button>
      <ion-segment-button value="minimum"> Critico </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let p of productList" style="display:flex; align-items:center;">
      <ion-label style="font-size: small; flex: 1;">
        <span>{{ getCategoryNameById(p?.data?.categ?.[0]) | capitalize }}&nbsp;</span>
      </ion-label>
      <ion-label style="font-size: small; flex: 3;">
        <h3>{{ p?.data?.name | uppercase }}</h3>
      </ion-label>
      <ion-label style="font-size: small; flex: 0.5; text-align:right;">
        <strong>{{ p?.data?.qty }}</strong>
        <span style="font-size: xx-small;"> {{ getUmNameById(p?.data?.um) }}</span>
      </ion-label>
      <ion-button color="primary" slot="end" (click)="delete(p); $event.stopPropagation()">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
