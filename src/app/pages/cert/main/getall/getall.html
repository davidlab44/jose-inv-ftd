<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar CCO (ej: TCSU 500046)"
      show-clear-button="always"
      (ionInput)="onCcoSearch($event.detail.value)"> 
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
 
  <div>
    <pre>{{fullWithdrawnList | json }}</pre>
  </div>  

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button class="fab-premium" (click)="plexaUploader('no estoy pasando nada')">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <br>

  <!-- LISTA DE REGISTROS -->
  <ng-container *ngIf="fullWithdrawnList && fullWithdrawnList.length>0">
    <ng-container *ngFor="let item of fullWithdrawnList">
      <ng-container
        *ngIf="
          !displayToEnevis ||
          (
            item?.data?.deliveryout?.length ==0 ||
            item?.data?.shipout == 0 ||
            item?.data?.imgout?.length ==0 
          )
        ">
        <ng-container
          *ngTemplateOutlet="withdrawnRow; context:{p:item}">
        </ng-container>
      </ng-container>
    </ng-container>
  </ng-container>
  <ng-template #withdrawnRow let-p="p">
    <ion-grid class="withdrawn-grid">
      <ion-row
        class="withdrawn-row ion-align-items-center"
        [ngClass]="{ 'row-erp': p.state === 'erp' }">
        <ion-col size="1">
          {{ p.id }}
        </ion-col>
        <!-- ISOTANQ -->
        <ion-col size="2" [style.background]="ccoMap[+p.data.name]?.color || '#eee'" (click)="discoverTwins(p)"> {{ ccoMap[+p.data.istq_id]?.name || 'N/A' }} </ion-col>
        <ion-col size="1" class="actions-col">
         <ion-button
            fill="clear"
            size="small"
            class="btn-compact"
            title="Viajes | Llegadas"
            [color]="p.data.shipin > 0 ? 'success' : 'dark'"
            (click)="patch(p,'in'); $event.stopPropagation()">
            <ion-icon name="boat-outline"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ng-template>


</ion-content>
