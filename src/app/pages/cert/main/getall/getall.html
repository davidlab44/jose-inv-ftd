<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar CCO (ej: TCSU 500046)"
      show-clear-button="always"
      (ionInput)="onCcoSearch($event.detail.value)"> 
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button
      class="fab-premium"
      (click)="plexaUploader('no estoy pasando nada')">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ng-container *ngIf="fullCertList?.length">

    <ion-grid class="withdrawn-grid">

      <ng-container *ngFor="let p of fullCertList">

        <ng-container
          *ngIf="
            !displayToEnevis ||
            p?.data?.deliveryout?.length==0 ||
            p?.data?.shipout==0 ||
            p?.data?.imgout?.length==0
          ">

          <ion-row
            class="withdrawn-row ion-align-items-center"
            [style.background]="p.data.type==1 ? '#A6B7FF' : '#C2FF9E'"
            [ngClass]="{'row-erp':p.state==='erp'}">

            <ion-col size="1">
              {{ p.data.istq_id }}
            </ion-col>

            <ion-col
              size="3"
              class="cco-pill"
              style="border-radius:9999px;"
              [style.background]="ccoMap[+p.data.istq_id]?.color || '#eee'"
              (click)="discoverTwins(p)">
              {{ ccoMap[+p.data.istq_id]?.name || 'N/A' }}
            </ion-col>

            <!--<ion-col-->
              <!--size="3"-->
              <!--[style.background]="ccoMap[+p.data.istq_id]?.color || '#eee'"-->
              <!--(click)="discoverTwins(p)">-->
              <!--{{ ccoMap[+p.data.istq_id]?.name || 'N/A' }}-->
            <!--</ion-col>-->

            <ion-col size="2">
              {{ p.data.year }}
            </ion-col>

            <ion-col size="2"></ion-col>

            <ion-col size="1" class="actions-col">
              <ion-button
                fill="clear"
                size="small"
                class="btn-compact"
                (click)="openCert(p,ccoMap[+p.data.istq_id]?.name);$event.stopPropagation()">
                <ion-icon name="eye-outline"></ion-icon>
              </ion-button>
            </ion-col>

            <ion-col size="1" class="actions-col">
              <ion-button
                fill="clear"
                size="small"
                class="btn-compact"
                (click)="openCert(p,ccoMap[+p.data.istq_id]?.name);$event.stopPropagation()">
                <ion-icon name="download-outline"></ion-icon>
              </ion-button>
            </ion-col>

            <ion-col size="1" class="actions-col">
              <ion-button
                fill="clear"
                size="small"
                class="btn-compact"
                (click)="openCert(p,ccoMap[+p.data.istq_id]?.name);$event.stopPropagation()">
                <ion-icon name="share-social-outline"></ion-icon>
              </ion-button>
            </ion-col>

            <ion-col size="1"></ion-col>

          </ion-row>

        </ng-container>

      </ng-container>

    </ion-grid>

  </ng-container>

</ion-content>
