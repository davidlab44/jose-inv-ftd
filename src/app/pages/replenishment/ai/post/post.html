<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">

<ion-grid>

  <ion-row>

    <!-- ================= ALBARAN 1 ================= -->

    <ion-col size="12" size-md="6">

      <ion-card class="albaran-card">

        <ion-card-header>
          <ion-card-title>Plexa</ion-card-title>
        </ion-card-header>

        <ion-card-content>

          <form>

            <ion-button expand="block">
              📸 Tomar foto
            </ion-button>

            <ion-button expand="block" color="secondary">
              🖼 Elegir de galería
            </ion-button>

            <ion-item>
              <ion-label position="floating">Name</ion-label>
              <ion-input></ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="floating">Barcode</ion-label>
              <ion-input type="number"></ion-input>
            </ion-item>

            <div class="download-container">
              <ion-button color="success">
                ⬇ Descargar albarán
              </ion-button>
            </div>

          </form>

        </ion-card-content>

      </ion-card>

    </ion-col>
