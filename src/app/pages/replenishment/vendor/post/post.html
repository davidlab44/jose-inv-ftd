<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-list>

      <ion-button expand="block" (click)="takePhotoAndUpload()">
        📸 Tomar foto
      </ion-button>

      <ion-button expand="block" color="secondary" (click)="pickImageAndUpload()">
        🖼 Elegir de galería
      </ion-button>

      <ion-progress-bar
        *ngIf="uploading"
        [value]="uploadProgress / 100">
      </ion-progress-bar>

      <p *ngIf="uploading">
        Subiendo: {{ uploadProgress }} %
      </p>

      <ion-card *ngIf="uploadedUrl">
        <ion-card-header>
          <ion-card-title>Imagen subida</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <img [src]="uploadedUrl" />
          <p>{{ uploadedUrl }}</p>
        </ion-card-content>
      </ion-card>

       <ion-item>
        <ion-label position="floating">Name</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Date | 2026-03-09T15:21:27</ion-label>
        <ion-input formControlName="date"></ion-input>
      </ion-item>
     <ion-item>
        <ion-label position="floating">Ticket</ion-label>
        <ion-input formControlName="ticket"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Kg</ion-label>
        <ion-input type="number" formControlName="kg"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Psi</ion-label>
        <ion-input type="number" formControlName="psi"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Rotogate</ion-label>
        <ion-input type="number" formControlName="rotogate"></ion-input>
      </ion-item>

      <ion-item *ngFor="let sealCtrl of seals.controls; let i = index">
        <ion-label position="floating">Seal {{ i + 1 }}</ion-label>
        <ion-input [formControl]="sealCtrl"></ion-input>
      </ion-item>

    </ion-list>
    <br>
    <pre>{{ocrResponse | json}}</pre>
    <br>
    <ion-button expand="block" (click)="guardar()">
      Guardar
    </ion-button>
  </form>

  <br>
  <br>
  <br>
  <br>
  <br>

</ion-content>
