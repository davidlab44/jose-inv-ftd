<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar color="light" class="subheader-toolbar">
    <ion-row>
      <ion-col size=6>
        <ion-title class="subheader-title">
          <span style= "font-size:xx-small;padding-bottom:5px;">
            Nacional
          </span>
        </ion-title>
      </ion-col>
      <ion-col size=6>
        <ion-title class="subheader-title">
          <span style= "font-size:xx-small;padding-bottom:5px;">
            Importado
          </span>
        </ion-title>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="floating">Nuevo precio</ion-label>
    <ion-input
      type="number"
      inputmode="numeric"
      placeholder="0"
      [(ngModel)]="numero">
    </ion-input>
  </ion-item>
  <br>
  <ion-button
    expand="block"
    (click)="addGlpprice(numero,1)">
    Actualizar precio
  </ion-button>
  <br>

  <table style="width: 100%;">
    <tr style="background-color:#d5d5d5;padding: 8px;"> 
       <td style="width: 80%;">
          <span style="font-size:small;">&nbsp;Precio actual {{ formatFechaLatam(lastGlpprice.created_at) }}&nbsp;&nbsp;</span>
      </td>
      <td style="padding:8px;width:20%;">
          <h5>{{lastGlpprice?.data?.price | currency:'COP':'symbol':'1.0-0':'es-CO'  }}&nbsp;</h5>
      </td>
    </tr>
  </table>
  <br><br>
 
 
 
  <ion-list style="color: #d5d5d5;"  > 

    <ion-item style="color:#d5d5d5;font-weight: 600;">
      <span>Historico</span>
    </ion-item>

    <ion-item *ngFor="let p of glppricesList" style="display:flex; align-items:center;color:#d5d5d5;font-weight: 600;" >

      <ion-label style="font-size: small; flex: 2; text-align:left;">
        <span style="font-size: x-small;"> {{ formatFechaLatam(p.created_at) }}</span>
      </ion-label>

      <ion-label style="font-size: small; flex: 3;">
        <h3>{{ p.data.price}}</h3>
      </ion-label>

    </ion-item>
  </ion-list>
