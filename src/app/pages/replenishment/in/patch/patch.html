<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">    
    <input type="hidden" formControlName="id">
    <ion-list>
      <ion-button expand="block" (click)="takePhotoAndUpload()">
        📸 Tomar foto
      </ion-button>
      <ion-button expand="block" color="secondary" (click)="pickImageAndUpload()">
        🖼 Elegir de galería
      </ion-button>
      <ion-progress-bar
        *ngIf="uploading"
        [value]="uploadProgress / 100">
      </ion-progress-bar>
      <p *ngIf="uploading">
        Subiendo: {{ uploadProgress }} %
      </p>
      <ion-card *ngIf="uploadedUrl">
        <ion-card-header>
          <ion-card-title>Imagen subida</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <img [src]="uploadedUrl" />
          <p>{{ uploadedUrl }}</p>
        </ion-card-content>
      </ion-card>
        <ion-item>
          <ion-label position="floating">Fecha remision (VACIOS) | 2026-02-25T00:00:00</ion-label>
          <ion-input formControlName="datein"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Entrega Numero:</ion-label>
          <ion-input formControlName="deliveryin"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Viaje:</ion-label>
          <ion-input formControlName="tripin"></ion-input>
        </ion-item>
<!--        <ion-item>-->
          <!--<ion-label position="floating">Barco:</ion-label>-->
          <!--<ion-input formControlName="shipin"></ion-input>-->
        <!--</ion-item>-->
        <br><br>
        <ion-item  *ngIf="shipList?.length"  >
          <ion-label>Motonave</ion-label>
          <ion-select
            interface="popover"
            formControlName="shipin"
            (ionChange)="onShipSelect($event)">
            <ion-select-option
              *ngFor="let ship of shipList"
              [value]="ship.id">
              {{ ship.data?.name | uppercase }}
            </ion-select-option>
          </ion-select>
        </ion-item>
        <br>
    </ion-list>
    <br>
    <ion-button expand="block" (click)="patch()">
      Guardar
    </ion-button>
  </form>
</ion-content>
