<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar  placeholder="Buscar" (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">    
    <input type="hidden" formControlName="id">
    <ion-list>
      <ion-button expand="block" (click)="takePhotoAndUpload()">
        📸 Tomar foto
      </ion-button>
      <ion-button expand="block" color="secondary" (click)="pickImageAndUpload()">
        🖼 Elegir de galería
      </ion-button>
      <ion-progress-bar
        *ngIf="uploading"
        [value]="uploadProgress / 100">
      </ion-progress-bar>
      <p *ngIf="uploading">
        Subiendo: {{ uploadProgress }} %
      </p>
      <ion-card *ngIf="uploadedUrl">
        <ion-card-header>
          <ion-card-title>Imagen subida</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <img [src]="uploadedUrl" />
          <p>{{ uploadedUrl }}</p>
        </ion-card-content>
      </ion-card>
        <ion-item>
          <ion-label position="floating">Fecha remision (LLENOS) | 2026-02-25T00:00:00</ion-label>
          <ion-input formControlName="dateout"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Entrega Numero:</ion-label>
          <ion-input formControlName="deliveryout"></ion-input>
        </ion-item>




        <ion-item>
          <ion-label position="floating">Viaje:</ion-label>
          <ion-input formControlName="tripout"></ion-input>
        </ion-item>
       


        <br><br>
        <ion-item  *ngIf="shipList?.length"  >
          <ion-label>Motonave</ion-label>
          <ion-select
            interface="popover"
            formControlName="shipout"
            (ionChange)="onShipSelect($event)">
            <ion-select-option
              *ngFor="let ship of shipList"
              [value]="ship.id">
              {{ ship.data?.name | uppercase }}
            </ion-select-option>
          </ion-select>
        </ion-item>
        <br>



        <br>
        <div style="border:solid 1px #d5d5d5;padding:10px">
          <ion-row>
            <ion-col size="8">
              <p style="font-size:10px;">Pareja:</p>
              <p style="font-size:10px;">{{isotanq2Name}} </p>
            </ion-col>
            <ion-col size="4" class="actions-col">
             <ion-button
                fill="clear"
                size="small"
                class="btn-compact"
                title="Pareja"
                [color]="'dark'"
                (click)="goToTwins(); $event.stopPropagation()">
                <ion-icon name="basket-outline"></ion-icon>
              </ion-button>
            </ion-col>
          </ion-row>
        </div>



        <!--<ion-item>-->
          <!--<ion-label position="floating">Barco:</ion-label>-->
          <!--<ion-input formControlName="shipout"></ion-input>-->
        <!--</ion-item>-->
    </ion-list>
    <br>
    <ion-button expand="block" (click)="patch()">
      Guardar
    </ion-button>
  </form>
</ion-content>
