<ion-header translucent="true">
  <ion-toolbar>
    <!-- Botón personalizado (NO ion-menu-button) -->
    <ion-buttons slot="start">
      <ion-button fill="clear">
        <ion-icon slot="icon-only" name="menu"></ion-icon>
      </ion-button>
    </ion-buttons>
    <!--<ion-searchbar-->
      <!--placeholder="Buscar"-->
      <!--(ionInput)="onSearch($event.target.value)">-->
    <!--</ion-searchbar>-->
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>

    <ion-grid
      *ngFor="let p of taskList"
      class="subtask">

      <!-- Nombre de la subtarea -->
      <ion-row>
        <ion-col size="12" class="subtask-title">
          {{ p?.data?.name | uppercase }}
        </ion-col>
      </ion-row>

      <!-- BOM -->
      <ion-row
        *ngFor="let item of p?.data?.bom"
        class="bom-row">

        <ion-col size="2"></ion-col>

        <ion-col size="7" class="bom-name">
          {{ item?.data?.name }}
        </ion-col>

        <ion-col size="1" class="bom-qty">
          {{ item?.data?.qty }}
        </ion-col>

        <ion-col size="2" class="bom-um">
          {{ item?.data?.umName }}
        </ion-col>

      </ion-row>

    </ion-grid>

  </ion-list>
</ion-content>
