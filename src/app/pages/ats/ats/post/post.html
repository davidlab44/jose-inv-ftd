<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons  slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <!--<ion-searchbar-->
      <!--placeholder="Buscar"-->
      <!--[value]="hash"-->
      <!--(ionInput)="onSearch($event.detail.value)">-->
    <!--</ion-searchbar>-->

    <ion-buttons slot="end">
      <ion-button>
        <span>
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Nombre de la tarea</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Unidad de medida</ion-label>
        <ion-select formControlName="um" placeholder="Seleccione una unidad">
          <ion-select-option *ngFor="let item of ums" [value]="item.id">
            {{ item.data.name }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>
    <br>
    <ion-grid class="bom-grid">
      <ion-row>
        <ion-col>
          <ion-searchbar  style="width:50%;"
            placeholder="Seleccionar Subtareas"
            [value]="hash"
            (ionInput)="onSearch($event.detail.value)">
          </ion-searchbar>
          <ion-list>
            <ion-item
              button
              detail="false"
              *ngFor="let p of filteredSubtaskList"
              (click)="selectSubtask(p)">
              <ion-label>
                {{ p.data.name }}
              </ion-label>
            </ion-item>
          </ion-list>
        </ion-col>
      </ion-row>

      <!--<ion-row *ngFor="let p of filteredSubtaskList">-->
        <!--<ion-col size="12" class="product-name">-->
          <!--{{ p.data.name }}-->
        <!--</ion-col>-->
      <!--</ion-row>-->


      <ion-row *ngFor="let p of selctSubtaskList">
        <ion-col size="7" class="product-name">
          {{ p.data.name }}
        </ion-col>
        <ion-col size="1" class="qty-container" >
          <span (click)="restartQty(p)" class="qty-control" >
            {{ p.data.qty || 0 }}
          </span>
        </ion-col>
        <ion-col size="1" class="control-col">
          <ion-button type="button" color="primary" (click)="incrementQty(p,1,$event)">
            +1
          </ion-button>
        </ion-col>
        <ion-col size="1" class="control-col">
          <ion-button type="button" color="primary" (click)="incrementQty(p,10,$event)">
            +10
          </ion-button>
        </ion-col>
        <ion-col size="1" class="control-col">
          <ion-button type="button" color="primary" (click)="incrementQty(p,100,$event)">
            +100
          </ion-button>
        </ion-col>
        <br>
        <ion-col size="1" class="control-col">
          <ion-button
            type="button"
            color="danger"
            (click)="removeById(p, $event)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-col>
        <br>
      </ion-row>

      <br>

      <ion-row>
        <ion-col>
          <ion-searchbar style="width:50%;"
            placeholder="Etapa"
            [value]="hazh"
            (ionInput)="onStgSearch($event.detail.value)">
          </ion-searchbar>
          <ion-list >
            <ion-item
              button
              detail="false"
              *ngFor="let p of fltStgList"
              (click)="selectStg(p)">
              <ion-label>
                {{ p.data.name }}
              </ion-label>
            </ion-item>
          </ion-list>
        </ion-col>
      </ion-row>
      <!--<ion-row>-->
        <!--<h2>selected</h2>-->
        <!--<pre>{{selectStg | json}}</pre>-->
      <!--</ion-row> -->
      <ion-row *ngIf="choosenStg?.id>0">
        <ion-col size="11" class="product-name">
          {{ choosenStg.data.name }}
        </ion-col>
<!--        <ion-col size="5" class="qty-container" >-->
          <!--<span  class="qty-control" >-->
            <!--{{ choosenStg.data.qty || 0 }}-->
          <!--</span>-->
      

          <!--[><pre>{{choosenStg.data | json}}</pre><]-->
        <!--</ion-col>-->
        <!--<ion-col size="1" class="control-col">-->
          <!--<ion-button type="button" color="primary" (click)="incrementQty(p,1,$event)">-->
            <!--+1-->
          <!--</ion-button>-->
        <!--</ion-col>-->
        <!--<ion-col size="1" class="control-col">-->
          <!--<ion-button type="button" color="primary" (click)="incrementQty(p,10,$event)">-->
            <!--+10-->
          <!--</ion-button>-->
        <!--</ion-col>-->
        <!--<ion-col size="1" class="control-col">-->
          <!--<ion-button type="button" color="primary" (click)="incrementQty(p,100,$event)">-->
            <!--+100-->
          <!--</ion-button>-->
        <!--</ion-col>-->
        <br>
        <ion-col size="1" class="control-col">
          <ion-button
            type="button"
            color="danger"
            (click)="removeStg(p, $event)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-col>
        <br>
      </ion-row>

    </ion-grid>
    <ion-button expand="block" (click)="guardar()">
      Guardar
    </ion-button>
  </form>
  <br>
  <br>
</ion-content>
