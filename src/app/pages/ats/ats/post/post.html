

<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-searchbar
      placeholder="Buscar"
      [value]="hash"
      (ionInput)="onSearch($event.detail.value)">
    </ion-searchbar>

    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-list *ngIf="filteredTaskList.length > 0">
    <ion-item
      button
      detail="false"
      *ngFor="let p of filteredTaskList"
      (click)="selectProduct(p)">
      <ion-label>
        {{ p.data.name }}
      </ion-label>
    </ion-item>
  </ion-list>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Crear tarea</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Unidad de medida</ion-label>
        <ion-select formControlName="um" placeholder="Seleccione una unidad">
          <ion-select-option *ngFor="let item of ums" [value]="item.id">
            {{ item.data.name }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>
    <br>
    <ion-grid class="bom-grid">
      <ion-row *ngFor="let p of bomList">
        <ion-col size="2" class="product-category">
          categ
        </ion-col>
        <ion-col size="5" class="product-name">
          {{ p.data.name }}
        </ion-col>
        <ion-col size="1" class="qty-container" >
          <span (click)="restartQty(p)" class="qty-control" >
            {{ p.data.qty || 0 }}
          </span>
        </ion-col>
        <ion-col size="1" class="control-col">
          <ion-button type="button" color="primary" (click)="incrementQty(p,1,$event)">
            +1
          </ion-button>
        </ion-col>
        <ion-col size="1" class="control-col">
          <ion-button type="button" color="primary" (click)="incrementQty(p,10,$event)">
            +10
          </ion-button>
        </ion-col>
        <ion-col size="1" class="control-col">
          <ion-button type="button" color="primary" (click)="incrementQty(p,100,$event)">
            +100
          </ion-button>
        </ion-col>
        <br>
        <ion-col size="1" class="control-col">
          <ion-button
            type="button"
            color="danger"
            (click)="removeById(p, $event)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-col>
        <br>
      </ion-row>
    </ion-grid>
    <ion-button expand="block" (click)="guardar()">
      Guardar
    </ion-button>
  </form>
  <br>
  <br>
</ion-content>
