<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Name</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Unidad de medida</ion-label>
        <ion-select formControlName="um" placeholder="Seleccione una unidad">
          <ion-select-option *ngFor="let item of ums" [value]="item.id">
            {{ item.data.name }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>
    <br>
    <ion-button expand="block" (click)="guardar()">
      Guardar
    </ion-button>
  </form>
  <br>
  <br>
</ion-content>
