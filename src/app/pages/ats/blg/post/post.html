<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-list>
       <ion-grid> 
         <ion-row>
           <ion-col size=6>
             <span (click)="resetList(bomList)">&nbsp;&nbsp;&nbsp;<ion-icon name="reload-outline"></ion-icon></span>
             <div *ngIf="bomList.length==0">
               <ion-searchbar placeholder="Buscar" [value]="hash" (ionInput)="onSearch($event.detail.value)">
               </ion-searchbar>
               <ion-item button detail="false" *ngFor="let p of filteredTaskList" (click)="selectTask(p)">
                  <ion-label>
                    {{ p.data.name }}
                  </ion-label>
               </ion-item>
             </div>
             <div *ngIf="bomList.length>0" ><br>
               <div *ngFor="let t of bomList" >
                 <span>data.name: {{t.data.name}}</span>
               </div>   


               <ion-grid class="bom-grid">
                 <ion-row *ngFor="let p of bomList">
                  <ion-col size="2" class="product-category">
                    categ
                  </ion-col>
                  <ion-col size="5" class="product-name">
                    {{ p.data.name }}
                  </ion-col>
                  <ion-col size="1" class="qty-container" >
                    <span (click)="restartQty(p)" class="qty-control" >
                      {{ p.data.qty || 0 }}
                    </span>
                  </ion-col>
                  <ion-col size="1" class="control-col">
                    <ion-button type="button" color="primary" (click)="incrementQty(p,1,$event)">
                      +1
                    </ion-button>
                  </ion-col>
                  <ion-col size="1" class="control-col">
                    <ion-button type="button" color="primary" (click)="incrementQty(p,10,$event)">
                      +10
                    </ion-button>
                  </ion-col>
                  <ion-col size="1" class="control-col">
                    <ion-button type="button" color="primary" (click)="incrementQty(p,100,$event)">
                      +100
                    </ion-button>
                  </ion-col>
                  <br>
                  <ion-col size="1" class="control-col">
                    <ion-button
                      type="button"
                      color="danger"
                      (click)="removeById(p, $event)">
                      <ion-icon name="trash-outline"></ion-icon>
                    </ion-button>
                   </ion-col>
                   <br>
                 </ion-row>
               </ion-grid>
             </div><br>
             <div *ngFor="let u of filteredUserList" >
               <span>data.name: {{u.data.name}}</span>
             </div> 
           </ion-col>
           <ion-col size=6>
             <span (click)="resetList(bomList)">&nbsp;&nbsp;<ion-icon name="reload-outline"></ion-icon></span>
             <ion-item button detail="false" *ngFor="let p of userList" (click)="selectUser(p)">
                <ion-label>
                  {{ p.data.name }} 
                </ion-label>
             </ion-item>
           </ion-col>
         </ion-row>
       </ion-grid>
    </ion-list>
    <br>
    <ion-button expand="block" (click)="guardar()">
      Guardar
    </ion-button>
  </form>
  <br>
  <br>
</ion-content>
