<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"
      (ionInput)="onSearch($event.target.value)">
    </ion-searchbar>
    <ion-buttons slot="end">
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span>
        <span *ngIf="!ios">
          <ion-icon slot="icon-only" name="options"></ion-icon>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-list>

      <ion-button expand="block" (click)="takePhotoAndUpload()">
        📸 Tomar foto
      </ion-button>

      <ion-button expand="block" color="secondary" (click)="pickImageAndUpload()">
        🖼 Elegir de galería
      </ion-button>

      <ion-progress-bar
        *ngIf="uploading"
        [value]="uploadProgress / 100">
      </ion-progress-bar>

      <p *ngIf="uploading">
        Subiendo: {{ uploadProgress }} %
      </p>

      <ion-card *ngIf="uploadedUrl">
        <ion-card-header>
          <ion-card-title>Imagen subida</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <img [src]="uploadedUrl" />
          <p>{{ uploadedUrl }}</p>
        </ion-card-content>
      </ion-card>

      <ion-item>
        <ion-label position="floating">Nombre comercial</ion-label>
        <ion-input formControlName="com_name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Razón social</ion-label>
        <ion-input formControlName="offc_name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Nit</ion-label>
        <ion-input formControlName="nit"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Dirección</ion-label>
        <ion-input formControlName="addr"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Telefono</ion-label>
        <ion-input formControlName="cel"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input formControlName="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Contacto</ion-label>
        <ion-input formControlName="cntct"></ion-input>
      </ion-item>
    </ion-list>
    <br>
    <br>
    <ion-button expand="block" (click)="guardar()">
      Guardar
    </ion-button>
  </form>

  <br>
  <br>
  <br>
  <br>

</ion-content>
