<ion-header translucent="true"> 
  <ion-toolbar>
    <ion-buttons *ngIf="!showSearchbar" slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar"     
      [value]="hash"           
      (ionInput)="onSearch($event.detail.value)">
    </ion-searchbar> 

    <ion-buttons slot="end">   
      <ion-button *ngIf="!showSearchbar" (click)="presentFilter()">
        <span *ngIf="ios">Filter</span> 
        <span *ngIf="!ios">
          <!--<span style="font-size:x-large;"><ion-icon name="add-outline"></ion-icon></span>-->
          <!--<ion-icon slot="icon-only" name="options"></ion-icon>-->
        </span>
      </ion-button>            
    </ion-buttons>
  </ion-toolbar>
  <ion-list class="search-results" *ngIf="filteredCcList.length > 0">
    <ion-item
      button
      detail="false"           
      *ngFor="let p of filteredCcList"
      [class.inside-workshop]="insideWorkshopIds.has(+p.id)"
      (click)="selectedItem(p)">
      <ion-label>              
        {{ p.data.name }}
      </ion-label>
    </ion-item>
  </ion-list>
</ion-header>
